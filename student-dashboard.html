<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/student.css">
    <script src="js/attendance-seed.js" defer></script>
    <script src="js/student-dashboard.js" defer></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-details">
            <span class="name"><h2>GROUP 9</h2></span>
        </div>

        <ul class="nav-links">
            <li><a href="#dashboard"><span class="link-name">Dashboard</span></a></li>
            <li><a href="#calendar"><span class="link-name">Calendar</span></a></li>
            <li><a href="#history"><span class="link-name">History</span></a></li>
            <li><a href="#analytics"><span class="link-name">Analytics</span></a></li>
            <li><a href="login-student.html"><span class="link-name">Logout</span></a></li>
        </ul>
    </aside>

    <div class="home-section">
        <div class="home-content">
            <p class="menu">☰</p>
            <span class="text">Menu</span>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>Welcome Allan Patrick M. Ebol</h1>
            <p>BSCS - 1F</p>
        </div>

        <div class="cards">
            <div class="card">
                <h4>Attendance Rate</h4>
                <h2 id="student-attendance-rate">0%</h2>
            </div>
            <div class="card">
                <h4>Present</h4>
                <h2 id="student-present-count">0</h2>
            </div>
            <div class="card">
                <h4>Absent</h4>
                <h2 id="student-absent-count">0</h2>
            </div>
            <div class="card">
                <h4>Late</h4>
                <h2 id="student-late-count">0</h2>
            </div>
        </div>

        <div class="grid">
            <div>
                <div class="panel" id="calendar">
                    <div class="calendar-header">
                        <button class="calendar-nav" id="previous-month" type="button" aria-label="Previous month">&#8249;</button>
                        <h3 id="calendar-title">Attendance Calendar</h3>
                        <button class="calendar-nav" id="next-month" type="button" aria-label="Next month">&#8250;</button>
                    </div>
                    <div class="calendar">
                    </div>
                </div>

                <div class="panel history" id="history">
                    <h3>Attendance History</h3>
                    <table>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                        <tbody id="attendance-history-body"></tbody>
                    </table>
                </div>
            </div>

            <div>
                <div class="panel health">
                    <h3>Attendance Health</h3>
                    <div class="score">96%</div>
                    <div class="status" id="attendance-health-status">No data</div>
                </div>

                <div class="panel" id="analytics">
                    <h3>Monthly Heat Map</h3>
                    <div class="heatmap"></div>
                </div>

                <div class="alert" id="absence-alert" role="alert" hidden>
                    <h3>⚠ Absence Warning</h3>
                    <p id="absence-alert-text"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
